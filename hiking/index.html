<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1f4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="등산 지도">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>등산 지도</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{--bar:#1f4d3a;--acc:#2f9e44;--rec:#e03131;--sub:#6b7280;--panel:118px;--safeB:env(safe-area-inset-bottom);--safeT:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:#1b1f27;overscroll-behavior:none;-webkit-text-size-adjust:100%;overflow:hidden}
body{background:#dfe7e2}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
svg{display:block}
#map{position:fixed;left:0;right:0;top:0;bottom:calc(var(--panel) + var(--safeB));background:#e8ede9}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:10px;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-control-attribution:hover,.leaflet-control-attribution:focus-within{white-space:normal}
/* ---------- 상단 ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:1000;display:flex;gap:8px;align-items:center;padding:calc(10px + var(--safeT)) 10px 10px;pointer-events:none}
#top>*{pointer-events:auto}
.round{width:46px;height:46px;flex:none;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--bar)}
.round:active{transform:scale(.95)}
#searchForm{flex:1;min-width:0;display:flex;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.18);overflow:hidden;height:46px}
#q{flex:1;min-width:0;border:0;outline:0;padding:0 12px;font-size:16px;background:none}
#searchForm button{padding:0 14px;color:var(--bar);font-weight:700}
#results{position:fixed;z-index:1001;left:10px;right:10px;top:calc(64px + var(--safeT));max-width:560px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);list-style:none;padding:4px 0;max-height:55vh;overflow:auto}
#results li button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:15px;line-height:1.35}
#results li button:active,#results li button:hover{background:#eef4f0}
#results small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .empty{padding:14px;color:var(--sub)}
/* 정보 칩 */
#chips{position:fixed;z-index:999;left:10px;top:calc(66px + var(--safeT));display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
.chip{background:rgba(255,255,255,.93);border-radius:16px;padding:5px 11px;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.15);white-space:nowrap}
.chip.warn{background:#fff4e6;color:#b35c00}
.chip.dark{background:#fff3f3;color:#c92a2a}
/* 오른쪽 버튼 */
#fabs{position:fixed;z-index:1060;right:10px;bottom:var(--fabB,calc(var(--panel) + var(--safeB) + 26px));display:flex;flex-direction:column;gap:10px}
#locBtn.on{color:#1c7ed6}
#locBtn.follow{background:#1c7ed6;color:#fff}
#measureBtn.on{background:var(--bar);color:#fff}
.leaflet-bottom{bottom:0}
.leaflet-control-scale{margin-bottom:6px!important}
/* ---------- 하단 기록 패널 ---------- */
#panel{position:fixed;z-index:1000;left:0;right:0;bottom:0;height:calc(var(--panel) + var(--safeB));background:#fff;box-shadow:0 -3px 14px rgba(0,0,0,.14);border-radius:16px 16px 0 0;padding:10px 12px var(--safeB)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;max-width:620px;margin:0 auto}
.stats b{display:block;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap}
.stats span{display:block;font-size:11.5px;color:var(--sub);margin-top:1px;white-space:nowrap}
.recbtns{display:flex;gap:8px;max-width:620px;margin:10px auto 0}
.recbtns button{flex:1;height:46px;border-radius:12px;font-size:16.5px;font-weight:700}
#recBtn{background:var(--acc);color:#fff}
#recBtn.live{background:var(--rec)}
#pauseBtn{background:#f1f3f5;color:#333}
#stopBtn{background:#212529;color:#fff}
.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rec);margin-right:6px;vertical-align:1px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
/* 거리 재기 바 */
#measureBar{position:fixed;z-index:1001;left:50%;transform:translateX(-50%);top:calc(66px + var(--safeT));background:var(--bar);color:#fff;border-radius:24px;padding:5px 5px 5px 16px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.3);white-space:nowrap;font-size:15px}
#measureBar b{font-variant-numeric:tabular-nums;margin-right:4px}
#measureBar button{padding:8px 12px;border-radius:18px;background:rgba(255,255,255,.14);font-size:14px}
body.measuring #chips{display:none}
body.measuring #map{cursor:crosshair}
/* ---------- 시트·카드 ---------- */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:1100}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1101;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);max-height:82vh;overflow-y:auto;padding:8px 16px calc(18px + var(--safeB));max-width:640px;margin:0 auto;animation:up .18s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:3px;background:#d0d5d2;margin:2px auto 10px}
.sheet h3{margin:4px 0 12px;font-size:18px;display:flex;align-items:center;justify-content:space-between}
.sheet h3 button{font-size:14px;color:var(--sub);padding:6px 8px;font-weight:400}
.menu{list-style:none;margin:0;padding:0}
.menu button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 6px;font-size:16px;border-bottom:1px solid #f0f2f1}
.menu li:last-child button{border-bottom:0}
.menu button:active,.menu button:hover{background:#f4f8f5}
.menu svg{color:var(--bar);flex:none}
.menu em{margin-left:auto;font-style:normal;color:var(--sub);font-size:14px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 4px;font-size:16px;border-bottom:1px solid #f0f2f1;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--acc);margin:0}
.opt small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.note{color:var(--sub);font-size:13px;line-height:1.6;margin:12px 2px 0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid #f0f2f1}
.list .main{flex:1;min-width:0;text-align:left}
.list .main b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .main small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.list .act{font-size:13.5px;padding:8px 10px;border-radius:8px;background:#f1f3f5;white-space:nowrap}
.list .act.del{color:#c92a2a;background:#fff5f5}
.empty{color:var(--sub);text-align:center;padding:26px 0;font-size:15px;line-height:1.6}
.help{font-size:15px;line-height:1.7}
.help h4{margin:16px 0 4px;font-size:15.5px;color:var(--bar)}
.help ul{margin:0;padding-left:18px}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btnrow button{flex:1;height:44px;border-radius:12px;font-weight:700;background:#f1f3f5;font-size:15px}
.btnrow .pri{background:var(--acc);color:#fff}
/* 트랙 카드(지도 위, 배경 없음) */
#card{position:fixed;z-index:1050;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.22);padding:12px 14px calc(14px + var(--safeB));animation:up .18s ease}
#card .head{display:flex;align-items:center;gap:8px}
#card .head b{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .head button{width:36px;height:36px;border-radius:10px;background:#f1f3f5;display:grid;place-items:center}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 4px;margin:10px 0 6px;text-align:center}
.kv b{display:block;font-size:16.5px;font-variant-numeric:tabular-nums}
.kv span{font-size:11.5px;color:var(--sub)}
#prof{width:100%;height:110px;display:block;touch-action:none;background:#f6faf7;border-radius:10px}
.profnote{font-size:12px;color:var(--sub);text-align:center;margin-top:4px}
/* 지도 위 표시 */
.me{position:relative;width:22px;height:22px}
.me i{position:absolute;inset:3px;border-radius:50%;background:#1c7ed6;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 1px 4px rgba(0,0,0,.35)}
.me s{position:absolute;left:50%;top:50%;width:0;height:0;margin:-34px 0 0 -13px;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:30px solid rgba(28,126,214,.35);transform-origin:13px 34px;display:none}
.me.hd s{display:block}
.wpt{width:28px;height:36px;margin:-36px 0 0 -14px}
.pin{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.mlabel{background:var(--bar);color:#fff;border:0;border-radius:10px;font-weight:700;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mlabel::before{display:none}
.pop{font-size:14px;line-height:1.5;min-width:180px}
.pop b{font-size:15px}
.pop .c{color:var(--sub);font-size:12.5px}
.pop .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pop .row button{padding:7px 10px;border-radius:8px;background:#eef4f0;color:var(--bar);font-size:13.5px;font-weight:600}
.pop .row button.del{background:#fff5f5;color:#c92a2a}
.leaflet-popup-content{margin:12px 14px}
#toast{position:fixed;z-index:1200;left:50%;transform:translateX(-50%);top:calc(140px + var(--safeT));background:rgba(25,30,28,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;max-width:88vw;text-align:center;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.3)}
body.drag #map::after{content:"GPX 파일을 여기에 놓으세요";position:absolute;inset:12px;border:3px dashed var(--acc);border-radius:16px;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--bar);background:rgba(255,255,255,.75);z-index:2000}
@media (min-width:700px){.stats b{font-size:24px}}
</style>
</head>
<body>
<div id="map"></div>

<header id="top">
  <button class="round" id="menuBtn" aria-label="메뉴"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <form id="searchForm" role="search">
    <input id="q" type="search" placeholder="산·장소 검색" enterkeyhint="search" autocomplete="off" aria-label="산이나 장소 검색">
    <button type="submit">검색</button>
  </form>
  <button class="round" id="layerBtn" aria-label="지도 종류"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/><path d="m2 17.5 10 5 10-5" opacity=".5"/></svg></button>
</header>
<ul id="results" hidden></ul>
<div id="chips"><div class="chip" id="sunChip" hidden></div><div class="chip" id="gpsChip" hidden></div></div>

<div id="fabs">
  <button class="round" id="measureBtn" aria-label="거리 재기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 17 3l4 4L7 21l-4-4Z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></button>
  <button class="round" id="locBtn" aria-label="내 위치"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/><path d="M12 1.5V5M12 19v3.5M1.5 12H5M19 12h3.5"/></svg></button>
</div>

<div id="measureBar" hidden><span>거리 재기</span> <b id="mDist">지도를 누르세요</b><button id="mUndo">되돌리기</button><button id="mDone">끝내기</button></div>

<section id="panel">
  <div class="stats">
    <div><b id="sDist">0.00</b><span id="sDistU">거리 (km)</span></div>
    <div><b id="sTime">0:00:00</b><span>시간</span></div>
    <div><b id="sGain">0</b><span id="sGainU">오른 높이 (m)</span></div>
    <div><b id="sEle">–</b><span id="sEleU">현재 고도 (m)</span></div>
  </div>
  <div class="recbtns">
    <button id="recBtn">산행 기록 시작</button>
    <button id="pauseBtn" hidden>일시정지</button>
    <button id="stopBtn" hidden>종료·저장</button>
  </div>
</section>

<div id="card" hidden></div>
<div id="backdrop" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="gpxFile" accept=".gpx,application/gpx+xml,application/xml,text/xml" multiple hidden>

<script src="vendor/leaflet.js"></script>
<script>
'use strict';
/* ================= 공통 도우미 ================= */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const settings = Object.assign({ units: 'metric', base: 'topo', trails: true }, LS.get('hike-settings', {}));
const saveSettings = () => LS.set('hike-settings', settings);

let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms);
}

/* 단위 */
const FT = 3.28084, MI = 1609.344;
const imp = () => settings.units === 'imperial';
function distParts(m) {
  if (imp()) return [(m / MI).toFixed(2), 'mi'];
  return [(m / 1000).toFixed(2), 'km'];
}
function fmtDist(m) {
  if (imp()) { const mi = m / MI; return mi < 0.1 ? Math.round(m * FT).toLocaleString() + ' ft' : mi.toFixed(2) + ' mi'; }
  return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
}
const eleUnit = () => imp() ? 'ft' : 'm';
const eleNum = m => (m == null || !isFinite(m)) ? '–' : Math.round(imp() ? m * FT : m).toLocaleString();
const fmtEle = m => (m == null || !isFinite(m)) ? '–' : eleNum(m) + ' ' + eleUnit();
function fmtDur(ms) {
  if (!(ms > 0)) return '0:00:00';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return h + ':' + String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}
function fmtDurKo(ms) {
  if (!(ms > 0)) return '–';
  const m = Math.round(ms / 60000), h = Math.floor(m / 60);
  return h ? `${h}시간 ${m % 60}분` : `${m}분`;
}
const hhmm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const dateKo = t => { const d = new Date(t); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} ${hhmm(d)}`; };

/* 거리 계산 (하버사인) */
function hav(a, b) {
  const R = 6371008.8, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}
/* 오르막/내리막: GPS 고도 흔들림을 무시하려고 4m 이상 변할 때만 누적 */
const EG = 4;
function eleAcc() { return { up: 0, down: 0, ref: null }; }
function eleStep(acc, e) {
  if (e == null || !isFinite(e)) return;
  if (acc.ref == null) { acc.ref = e; return; }
  const d = e - acc.ref;
  if (d >= EG) { acc.up += d; acc.ref = e; } else if (d <= -EG) { acc.down -= d; acc.ref = e; }
}
function trackStats(pts) {
  let dist = 0, max = -Infinity, min = Infinity; const acc = eleAcc();
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (i) dist += hav(pts[i - 1], p);
    if (p[2] != null && isFinite(p[2])) { max = Math.max(max, p[2]); min = Math.min(min, p[2]); }
    eleStep(acc, p[2]);
  }
  const t0 = pts.length && pts[0][3], t1 = pts.length && pts[pts.length - 1][3];
  return { dist, gain: acc.up, loss: acc.down, max: isFinite(max) ? max : null, min: isFinite(min) ? min : null, dur: (t0 && t1) ? t1 - t0 : 0 };
}

/* 일출·일몰 (NOAA/SunCalc 방식 근사식) */
function sunTimes(date, lat, lng) {
  const rad = Math.PI / 180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009;
  const toJ = d => d.valueOf() / dayMs - 0.5 + J1970, fromJ = j => new Date((j + 0.5 - J1970) * dayMs);
  const d = toJ(date) - J2000, lw = rad * -lng, phi = rad * lat;
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const ds = J0 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds);
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(L) * Math.sin(rad * 23.4397));
  const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const cosw = (Math.sin(rad * -0.833) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
  if (cosw < -1 || cosw > 1) return null;
  const w = Math.acos(cosw);
  const Jset = J2000 + J0 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
}

/* IndexedDB: 산행 기록 저장소 */
const DB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('hiking-map', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tracks', { keyPath: 'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('tracks', mode), r = fn(t.objectStore('tracks'));
    t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
  }));
  return {
    all: () => tx('readonly', s => s.getAll()),
    get: id => tx('readonly', s => s.get(id)),
    put: o => tx('readwrite', s => s.put(o)),
    del: id => tx('readwrite', s => s.delete(id))
  };
})();

/* ================= 지도 ================= */
const BASES = {
  topo: { name: '지형도 (등고선)', desc: '등고선·등산로·봉우리 높이 표시. 산행에 추천', url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    o: { subdomains: 'abc', maxNativeZoom: 17, maxZoom: 19, attribution: '지도 © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA) · 데이터 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' } },
  osm: { name: '일반 지도', desc: '도로·건물 위주. 들머리 찾기에 편함', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    o: { maxNativeZoom: 19, maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' } },
  sat: { name: '위성 사진', desc: '실제 지형·숲·바위 확인용', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    o: { maxNativeZoom: 18, maxZoom: 19, attribution: '사진 © Esri, Maxar, Earthstar Geographics' } }
};
const view0 = LS.get('hike-view', null);
const map = L.map('map', { zoomControl: false, worldCopyJump: true, tapHold: true })
  .setView(view0 ? [view0.lat, view0.lng] : [36.3, 127.8], view0 ? view0.z : 7);
let baseLayer = null, scaleCtl = null;
const trailLayer = L.tileLayer('https://tile.waymarkedtrails.org/hiking/{z}/{x}/{y}.png',
  { maxNativeZoom: 17, maxZoom: 19, opacity: .85, zIndex: 5, attribution: '등산로 © <a href="https://hiking.waymarkedtrails.org">Waymarked Trails</a>' });
function setBase(key) {
  if (!BASES[key]) key = 'topo';
  if (baseLayer) map.removeLayer(baseLayer);
  baseLayer = L.tileLayer(BASES[key].url, BASES[key].o).addTo(map);
  settings.base = key; saveSettings();
}
function setTrails(on) {
  settings.trails = !!on; saveSettings();
  if (on) trailLayer.addTo(map); else map.removeLayer(trailLayer);
}
function setScale() {
  if (scaleCtl) map.removeControl(scaleCtl);
  scaleCtl = L.control.scale({ position: 'bottomleft', metric: !imp(), imperial: imp(), maxWidth: 110 }).addTo(map);
}
setBase(settings.base); setTrails(settings.trails); setScale();
map.attributionControl.setPrefix(false);
map.on('moveend', () => { const c = map.getCenter(); LS.set('hike-view', { lat: c.lat, lng: c.lng, z: map.getZoom() }); updateSun(); });

/* ================= 내 위치 · 나침반 ================= */
let me = null;          // {lat,lng,acc,alt,t}
let watchId = null, follow = false, heading = null;
const meIcon = L.divIcon({ className: '', html: '<div class="me"><s></s><i></i></div>', iconSize: [22, 22], iconAnchor: [11, 11] });
const meMarker = L.marker([0, 0], { icon: meIcon, interactive: false, keyboard: false, zIndexOffset: 1000 });
const accCircle = L.circle([0, 0], { radius: 1, stroke: false, fillColor: '#1c7ed6', fillOpacity: .12, interactive: false });

function setLocBtn() {
  const b = $('#locBtn');
  b.classList.toggle('on', watchId != null && !follow);
  b.classList.toggle('follow', follow);
}
function startWatch() {
  if (watchId != null) return;
  if (!('geolocation' in navigator)) { toast('이 브라우저는 위치 기능을 지원하지 않습니다'); return; }
  watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  setLocBtn();
}
function onPosErr(err) {
  const chip = $('#gpsChip');
  if (err.code === 1) {
    navigator.geolocation.clearWatch(watchId); watchId = null; follow = false; setLocBtn();
    chip.hidden = true;
    toast('위치 권한이 꺼져 있습니다. 브라우저 설정에서 이 사이트의 위치 접근을 허용해 주세요', 5000);
  } else {
    chip.hidden = false; chip.className = 'chip warn'; chip.textContent = 'GPS 신호를 찾는 중…';
  }
}
function onPos(p) {
  const c = p.coords;
  me = { lat: c.latitude, lng: c.longitude, acc: c.accuracy, alt: (c.altitude == null ? null : c.altitude), t: p.timestamp || Date.now() };
  const ll = [me.lat, me.lng];
  if (!map.hasLayer(meMarker)) { meMarker.addTo(map); accCircle.addTo(map); }
  meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(me.acc);
  if (follow) map.panTo(ll, { animate: true, duration: .4 });
  const chip = $('#gpsChip');
  chip.hidden = false;
  if (me.acc > 50) { chip.className = 'chip warn'; chip.textContent = `GPS 약함 (±${fmtDist(me.acc)})`; }
  else { chip.className = 'chip'; chip.textContent = `GPS ±${fmtDist(me.acc)}`; }
  $('#sEle').textContent = eleNum(me.alt);
  recOnPos(p);
  updateSun();
}
function centerOnMe() {
  if (me) map.setView([me.lat, me.lng], Math.max(map.getZoom(), 15));
}
$('#locBtn').onclick = () => {
  askCompass();
  if (watchId == null) { follow = true; startWatch(); toast('내 위치를 찾는 중…', 1800); }
  else { follow = true; centerOnMe(); if (!me) toast('내 위치를 찾는 중…', 1800); }
  setLocBtn();
  if (me && map.getZoom() < 14) map.setView([me.lat, me.lng], 15);
};
map.on('dragstart', () => { if (follow) { follow = false; setLocBtn(); } });

/* 나침반: 휴대폰이 향한 방향을 내 위치 점 위에 부채꼴로 표시 */
let compassOn = false, hdRaf = 0;
function onOrient(e) {
  let h = null;
  if (typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) h = 360 - e.alpha;
  if (h == null) return;
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  heading = (h + ang + 360) % 360;
  if (!hdRaf) hdRaf = requestAnimationFrame(() => {
    hdRaf = 0;
    const el = meMarker.getElement(); if (!el) return;
    const box = el.querySelector('.me'); box.classList.add('hd');
    box.querySelector('s').style.transform = `rotate(${heading}deg)`;
  });
}
function askCompass() {
  if (compassOn) return;
  const go = () => {
    compassOn = true;
    if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onOrient);
    else window.addEventListener('deviceorientation', onOrient);
  };
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') go(); }).catch(() => {});
  } else go();
}

/* 일몰 시각 */
function updateSun() {
  const chip = $('#sunChip');
  const pos = me ? { lat: me.lat, lng: me.lng } : (map.getZoom() >= 9 ? map.getCenter() : null);
  if (!pos) { chip.hidden = true; return; }
  const now = new Date(), st = sunTimes(now, pos.lat, pos.lng);
  if (!st) { chip.hidden = true; return; }
  chip.hidden = false;
  const left = st.set - now;
  if (now < st.rise) { chip.className = 'chip'; chip.textContent = `일출 ${hhmm(st.rise)} · 일몰 ${hhmm(st.set)}`; }
  else if (left > 0) {
    chip.className = left < 3600e3 ? 'chip warn' : 'chip';
    chip.textContent = `일몰 ${hhmm(st.set)} · ${fmtDurKo(left)} 남음`;
  } else { chip.className = 'chip dark'; chip.textContent = `일몰 지남 (${hhmm(st.set)}) · 랜턴 확인`; }
}
setInterval(updateSun, 60e3);

/* ================= 산행 기록 ================= */
// rec = {state:'run'|'pause', start, acc(ms 누적), resumed(ms 시각), pts:[[lat,lng,ele,t]], wpts:[]}
let rec = LS.get('hike-rec', null);
let recLine = null, recDist = 0, recEle = eleAcc(), recSaveT = 0, wakeLock = null;
function recElapsed() { return rec ? rec.acc + (rec.state === 'run' ? Date.now() - rec.resumed : 0) : 0; }
function recPersist(force) {
  if (!rec) return;
  const now = Date.now();
  if (!force && now - recSaveT < 8000) return;
  recSaveT = now;
  if (!LS.set('hike-rec', rec)) toast('저장 공간이 부족합니다. 기록을 종료·저장해 주세요');
}
function recRebuild() {
  recDist = 0; recEle = eleAcc();
  rec.pts.forEach((p, i) => { if (i) recDist += hav(rec.pts[i - 1], p); eleStep(recEle, p[2]); });
  if (!recLine) recLine = L.polyline([], { color: '#e03131', weight: 5, opacity: .9, interactive: false }).addTo(map);
  recLine.setLatLngs(rec.pts.map(p => [p[0], p[1]]));
}
function recOnPos(p) {
  if (!rec || rec.state !== 'run') return;
  const c = p.coords;
  if (c.accuracy > 40) return; // 오차가 큰 위치는 버림
  const pt = [+c.latitude.toFixed(7), +c.longitude.toFixed(7), c.altitude == null ? null : +c.altitude.toFixed(1), p.timestamp || Date.now()];
  const last = rec.pts[rec.pts.length - 1];
  if (last) {
    const d = hav(last, pt);
    if (d < Math.max(5, c.accuracy * 0.6)) return; // 제자리 흔들림 무시
    if (d / Math.max(1, (pt[3] - last[3]) / 1000) > 15) return; // 초속 15m 넘는 튐 무시
    recDist += d;
  }
  eleStep(recEle, pt[2]);
  rec.pts.push(pt);
  recLine.addLatLng([pt[0], pt[1]]);
  recPersist(false);
  renderStats();
}
function renderStats() {
  const [dv, du] = distParts(rec ? recDist : 0);
  $('#sDist').textContent = dv;
  $('#sDistU').textContent = `거리 (${du})`;
  $('#sGain').textContent = eleNum(rec ? recEle.up : 0);
  $('#sGainU').textContent = `오른 높이 (${eleUnit()})`;
  $('#sEleU').textContent = `현재 고도 (${eleUnit()})`;
  $('#sEle').textContent = eleNum(me && me.alt);
  $('#sTime').textContent = fmtDur(recElapsed());
}
function renderRecUI() {
  const r = $('#recBtn'), pa = $('#pauseBtn'), st = $('#stopBtn');
  if (!rec) { r.hidden = false; r.className = ''; r.textContent = '산행 기록 시작'; pa.hidden = st.hidden = true; }
  else {
    r.hidden = true; pa.hidden = st.hidden = false;
    pa.innerHTML = rec.state === 'run' ? '<span class="recdot"></span>일시정지' : '계속하기';
  }
  renderStats();
}
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && rec && rec.state === 'run') keepAwake(true);
  if (document.visibilityState === 'hidden') recPersist(true);
});
window.addEventListener('pagehide', () => recPersist(true));
$('#recBtn').onclick = () => {
  const now = Date.now();
  rec = { state: 'run', start: now, acc: 0, resumed: now, pts: [] };
  recRebuild(); recPersist(true);
  startWatch(); follow = true; setLocBtn(); askCompass();
  keepAwake(true); renderRecUI();
  if (me) { centerOnMe(); recOnPos({ coords: { latitude: me.lat, longitude: me.lng, accuracy: me.acc, altitude: me.alt }, timestamp: now }); }
  toast('기록을 시작했습니다. 화면이 꺼지면 기록이 멈출 수 있으니 앱을 켜 두세요', 4500);
};
$('#pauseBtn').onclick = () => {
  if (!rec) return;
  const now = Date.now();
  if (rec.state === 'run') { rec.acc += now - rec.resumed; rec.state = 'pause'; keepAwake(false); toast('일시정지했습니다'); }
  else { rec.state = 'run'; rec.resumed = now; keepAwake(true); startWatch(); toast('기록을 계속합니다'); }
  recPersist(true); renderRecUI();
};
$('#stopBtn').onclick = async () => {
  if (!rec) return;
  if (!confirm('산행 기록을 끝낼까요?')) return;
  const end = Date.now();
  if (rec.state === 'run') rec.acc += end - rec.resumed;
  const d = new Date(rec.start);
  const defName = `${d.getMonth() + 1}월 ${d.getDate()}일 산행`;
  if (rec.pts.length < 2) {
    if (!confirm('기록된 이동 경로가 거의 없습니다. 저장하지 않고 끝낼까요?')) { if (rec.state === 'run') rec.resumed = Date.now(); return; }
    recClear(); return;
  }
  let name = prompt('기록 이름', defName);
  if (name === null) name = defName;
  const s = trackStats(rec.pts);
  const t = { id: 't' + rec.start, name: name.trim() || defName, date: rec.start, moving: rec.acc, pts: rec.pts, ...s };
  try {
    await DB.put(t);
    recClear();
    showTrack(t);
    toast('저장했습니다. 메뉴 › 내 산행 기록에서 다시 볼 수 있어요', 3500);
  } catch (e) {
    toast('저장에 실패했습니다: ' + (e && e.message || e), 5000);
  }
};
function recClear() {
  rec = null; LS.del('hike-rec'); keepAwake(false);
  if (recLine) { map.removeLayer(recLine); recLine = null; }
  recDist = 0; recEle = eleAcc(); renderRecUI();
}
setInterval(() => { if (rec && rec.state === 'run') $('#sTime').textContent = fmtDur(recElapsed()); }, 1000);

/* ================= 트랙 보기 (저장된 기록 · GPX) ================= */
let trackLayer = null, cursor = null, curTrack = null;
const pinIcon = (txt, color) => L.divIcon({ className: '', html: `<div class="pin" style="background:${color}">${txt}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
function clearTrack() {
  if (trackLayer) { map.removeLayer(trackLayer); trackLayer = null; }
  if (cursor) { map.removeLayer(cursor); cursor = null; }
  curTrack = null; $('#card').hidden = true;
  document.documentElement.style.removeProperty('--fabB');
}
function showTrack(t) {
  clearTrack();
  curTrack = t;
  const ll = t.pts.map(p => [p[0], p[1]]);
  const g = [L.polyline(ll, { color: '#ffffff', weight: 8, opacity: .8, interactive: false }),
             L.polyline(ll, { color: '#d9480f', weight: 5, opacity: .95, interactive: false })];
  if (ll.length) {
    g.push(L.marker(ll[0], { icon: pinIcon('S', '#2f9e44'), keyboard: false }).bindTooltip('출발'));
    g.push(L.marker(ll[ll.length - 1], { icon: pinIcon('E', '#c92a2a'), keyboard: false }).bindTooltip('도착'));
  }
  (t.wpts || []).forEach(w => g.push(L.circleMarker([w.lat, w.lng], { radius: 6, color: '#fff', weight: 2, fillColor: '#7048e8', fillOpacity: 1 })
    .bindPopup(`<div class="pop"><b>${esc(w.name || '지점')}</b>${w.ele != null ? `<div class="c">${fmtEle(w.ele)}</div>` : ''}</div>`)));
  trackLayer = L.layerGroup(g).addTo(map);
  follow = false; setLocBtn();
  openCard(t);
  if (ll.length) {
    const h = $('#card').offsetHeight;
    map.fitBounds(L.latLngBounds(ll), { paddingTopLeft: [30, 80], paddingBottomRight: [30, Math.max(30, h - 100)], maxZoom: 16 });
  }
}
function openCard(t) {
  const c = $('#card');
  const hasEle = t.pts.some(p => p[2] != null);
  c.innerHTML = `<div class="head"><b>${esc(t.name)}</b>
      <button id="cMore" aria-label="더보기"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <button id="cClose" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="kv">
      <div><b>${fmtDist(t.dist)}</b><span>거리</span></div>
      <div><b>${t.moving ? fmtDur(t.moving) : (t.dur ? fmtDur(t.dur) : '–')}</b><span>${t.moving ? '기록 시간' : '소요 시간'}</span></div>
      <div><b>${fmtEle(t.gain)}</b><span>오른 높이</span></div>
      <div><b>${fmtEle(t.loss)}</b><span>내린 높이</span></div>
      <div><b>${fmtEle(t.max)}</b><span>최고 고도</span></div>
      <div><b>${fmtEle(t.min)}</b><span>최저 고도</span></div>
    </div>
    ${hasEle ? '<canvas id="prof"></canvas><div class="profnote">고도 그래프를 손가락으로 훑으면 지도에 위치가 표시됩니다</div>' : '<div class="profnote">이 경로에는 고도 정보가 없습니다</div>'}`;
  c.hidden = false;
  document.documentElement.style.setProperty('--fabB', (c.offsetHeight + 14) + 'px');
  $('#cClose').onclick = clearTrack;
  $('#cMore').onclick = () => trackActions(t);
  if (hasEle) drawProfile(t);
}
function drawProfile(t) {
  const cv = $('#prof'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const xs = [], ys = [], idx = []; let d = 0;
  t.pts.forEach((p, i) => { if (i) d += hav(t.pts[i - 1], p); if (p[2] != null) { xs.push(d); ys.push(p[2]); idx.push(i); } });
  if (ys.length < 2) return;
  let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 20) { const m = (hi + lo) / 2; lo = m - 10; hi = m + 10; }
  const padL = 44, padR = 8, padT = 10, padB = 18, total = xs[xs.length - 1] || 1;
  const X = v => padL + (W - padL - padR) * v / total, Y = v => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
  const draw = (cx) => {
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#6b7280'; g.font = '11px sans-serif'; g.textAlign = 'right'; g.textBaseline = 'middle';
    g.fillText(eleNum(hi), padL - 6, Y(hi)); g.fillText(eleNum(lo), padL - 6, Y(lo));
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillText(eleUnit(), 4, H - 4); g.textAlign = 'right'; g.fillText(fmtDist(total), W - padR, H - 4);
    g.strokeStyle = '#e3e9e5'; g.lineWidth = 1; g.beginPath(); g.moveTo(padL, Y(hi)); g.lineTo(W - padR, Y(hi)); g.moveTo(padL, Y(lo)); g.lineTo(W - padR, Y(lo)); g.stroke();
    g.beginPath(); g.moveTo(X(xs[0]), Y(lo));
    for (let i = 0; i < xs.length; i++) g.lineTo(X(xs[i]), Y(ys[i]));
    g.lineTo(X(xs[xs.length - 1]), Y(lo)); g.closePath();
    g.fillStyle = 'rgba(47,158,68,.22)'; g.fill();
    g.beginPath(); for (let i = 0; i < xs.length; i++) (i ? g.lineTo : g.moveTo).call(g, X(xs[i]), Y(ys[i]));
    g.strokeStyle = '#2b8a3e'; g.lineWidth = 2; g.stroke();
    if (cx != null) {
      let k = 0; const target = (cx - padL) / (W - padL - padR) * total;
      while (k < xs.length - 1 && xs[k] < target) k++;
      g.strokeStyle = '#d9480f'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X(xs[k]), padT); g.lineTo(X(xs[k]), H - padB); g.stroke();
      g.fillStyle = '#d9480f'; g.beginPath(); g.arc(X(xs[k]), Y(ys[k]), 4, 0, 7); g.fill();
      const label = `${fmtDist(xs[k])} · ${fmtEle(ys[k])}`;
      g.font = 'bold 12px sans-serif'; g.textAlign = X(xs[k]) > W / 2 ? 'right' : 'left'; g.textBaseline = 'top';
      g.fillStyle = '#1b1f27'; g.fillText(label, X(xs[k]) + (g.textAlign === 'right' ? -8 : 8), padT);
      const p = t.pts[idx[k]];
      if (!cursor) cursor = L.circleMarker([p[0], p[1]], { radius: 8, color: '#fff', weight: 3, fillColor: '#d9480f', fillOpacity: 1, interactive: false }).addTo(map);
      else cursor.setLatLng([p[0], p[1]]);
    }
  };
  draw(null);
  const mv = e => { const r = cv.getBoundingClientRect(); draw(Math.max(padL, Math.min(W - padR, e.clientX - r.left))); };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); mv(e); });
  cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') mv(e); });
}
function trackActions(t) {
  const saved = !t.unsaved;
  openSheet(`<h3>${esc(t.name)}</h3><ul class="menu">
    ${saved ? '' : `<li><button data-a="save">${ICON.save} 내 산행 기록에 저장</button></li>`}
    <li><button data-a="gpx">${ICON.down} GPX 파일로 내보내기</button></li>
    ${saved ? `<li><button data-a="ren">${ICON.edit} 이름 바꾸기</button></li>` : ''}
    ${saved ? `<li><button data-a="del" style="color:#c92a2a">${ICON.trash} 기록 삭제</button></li>` : ''}
  </ul>`, sh => {
    sh.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
      const a = b.dataset.a;
      if (a === 'gpx') { downloadGPX(t); closeSheet(); }
      if (a === 'save') { delete t.unsaved; await DB.put(t); closeSheet(); toast('내 산행 기록에 저장했습니다'); }
      if (a === 'ren') { const n = prompt('새 이름', t.name); if (n && n.trim()) { t.name = n.trim(); await DB.put(t); closeSheet(); openCard(t); } }

    });

}

/* ================= GPX 불러오기 · 내보내기 ================= */
function parseGPX(text, fname) {
  const x = new DOMParser().parseFromString(text, 'application/xml');
  if (x.getElementsByTagName('parsererror').length) throw new Error('GPX 파일 형식이 올바르지 않습니다');
  const num = (n, tag) => { const e = n.getElementsByTagName(tag)[0]; const v = e ? parseFloat(e.textContent) : NaN; return isFinite(v) ? v : null; };
  const tm = n => { const e = n.getElementsByTagName('time')[0]; const v = e ? Date.parse(e.textContent) : NaN; return isFinite(v) ? v : null; };
  let nodes = [...x.getElementsByTagName('trkpt')];
  if (!nodes.length) nodes = [...x.getElementsByTagName('rtept')];
  const pts = nodes.map(n => [parseFloat(n.getAttribute('lat')), parseFloat(n.getAttribute('lon')), num(n, 'ele'), tm(n)])
    .filter(p => isFinite(p[0]) && isFinite(p[1]));
  const wpts = [...x.getElementsByTagName('wpt')].map(n => {
    const nm = n.getElementsByTagName('name')[0];
    return { lat: parseFloat(n.getAttribute('lat')), lng: parseFloat(n.getAttribute('lon')), ele: num(n, 'ele'), name: nm ? nm.textContent.trim() : '' };
  }).filter(w => isFinite(w.lat) && isFinite(w.lng));
  if (!pts.length && !wpts.length) throw new Error('파일 안에 경로가 없습니다');
  let name = '';
  for (const tag of ['trk', 'rte', 'metadata']) {
    const el = x.getElementsByTagName(tag)[0];
    const nm = el && [...el.children].find(c => c.localName === 'name');
    if (nm && nm.textContent.trim()) { name = nm.textContent.trim(); break; }
  }
  if (!name) name = (fname || '불러온 경로').replace(/\.gpx$/i, '');
  return { id: 'g' + Date.now() + Math.floor(Math.random() * 1000), name, date: pts.length && pts[0][3] || Date.now(), pts, wpts, unsaved: true, ...trackStats(pts) };
}
async function importFiles(files) {
  let last = null;
  for (const f of files) {
    try { last = parseGPX(await f.text(), f.name); }
    catch (e) { toast(`${f.name}: ${e.message}`, 4000); }
  }
  if (last) {
    if (!last.pts.length && last.wpts.length) {
      last.pts = [];
      showTrack(last);
      map.fitBounds(L.latLngBounds(last.wpts.map(w => [w.lat, w.lng])), { padding: [40, 40], maxZoom: 15 });
    } else showTrack(last);
    toast('경로를 불러왔습니다. ··· 버튼으로 내 기록에 저장할 수 있어요', 3500);
  }
}
$('#gpxFile').onchange = e => { importFiles([...e.target.files]); e.target.value = ''; };
function toGPX(t) {
  const xe = s => esc(s);
  const trk = t.pts.map(p => `    <trkpt lat="${p[0].toFixed(7)}" lon="${p[1].toFixed(7)}">${p[2] != null ? `<ele>${(+p[2]).toFixed(1)}</ele>` : ''}${p[3] ? `<time>${new Date(p[3]).toISOString()}</time>` : ''}</trkpt>`).join('\n');
  const w = (t.wpts || []).map(w => `  <wpt lat="${w.lat.toFixed(7)}" lon="${w.lng.toFixed(7)}">${w.ele != null ? `<ele>${(+w.ele).toFixed(1)}</ele>` : ''}<name>${xe(w.name)}</name></wpt>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Hiking Map PWA" xmlns="http://www.topografix.com/GPX/1/1">
  <metadata><name>${xe(t.name)}</name><time>${new Date(t.date || Date.now()).toISOString()}</time></metadata>
${w}${w ? '\n' : ''}  <trk><name>${xe(t.name)}</name><trkseg>
${trk}
  </trkseg></trk>
</gpx>
`;
}
function downloadGPX(t) {
  const blob = new Blob([toGPX(t)], { type: 'application/gpx+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (t.name.replace(/[\\/:*?"<>|]+/g, '_') || 'track') + '.gpx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

    <h4>기본 사용</h4><ul>
      <li><b>◎ 버튼</b>: 내 위치로 이동하고 따라갑니다. 휴대폰이 향한 방향이 파란 부채꼴로 보입니다.</li>
      <li><b>지도 종류 버튼</b>(오른쪽 위): 지형도·일반 지도·위성 사진, 등산로 표시를 고릅니다.</li>
      <li><b>지도를 길게 누르기</b>: 좌표 확인, 지점 저장(갈림길·샘터·주차장 등).</li>
      <li><b>자 버튼</b>: 지도를 차례로 눌러 직선거리를 잽니다.</li>
      <li><b>산행 기록</b>: 아래 버튼으로 시작·일시정지·종료합니다. 기록은 이 기기에만 저장되며 GPX로 내보낼 수 있습니다.</li>
      <li><b>GPX 불러오기</b>: 다른 앱·사이트에서 받은 등산로 파일을 지도에 띄우고 고도 그래프를 봅니다. 컴퓨터에서는 지도 위로 끌어다 놓아도 됩니다.</li>
    </ul>
    <h4>꼭 알아 두세요</h4><ul>
      <li>웹 앱은 <b>화면이 꺼지거나 다른 앱으로 넘어가면 위치 기록이 멈출 수 있습니다</b>(특히 아이폰). 기록 중에는 화면 켜짐을 유지하도록 요청하지만, 배터리 절약 모드에서는 안 될 수 있습니다.</li>
      <li>지도는 <b>한 번 본 지역만</b> 오프라인에서 다시 보입니다. 신호가 약한 산에 가기 전, 와이파이에서 코스 주변을 확대해 미리 훑어 두세요.</li>
      <li>GPS 고도는 수십 m 오차가 있을 수 있습니다. 오른 높이는 참고용입니다.</li>
      <li>등산로 정보는 OpenStreetMap 자원봉사자 데이터라 실제와 다를 수 있습니다. 현장 표지판과 공식 안내를 우선하세요.</li>
      <li>위급하면 미국 <b>911</b>, 한국 <b>119</b>. 메뉴의 <b>내 위치 보내기</b>로 좌표를 전달할 수 있습니다.</li>
    </ul>
    <h4>지도 출처</h4>
    <p class="note" style="margin-top:0">OpenTopoMap, OpenStreetMap 기여자, Waymarked Trails, Esri World Imagery. 장소 검색은 OpenStreetMap Nominatim을 사용합니다.</p>
  </div>`, sh => { sh.querySelector('[data-a=back]').onclick = () => $('#menuBtn').click(); });
}
$('#layerBtn').onclick = () => {
  openSheet(`<h3>지도 종류</h3>
    ${Object.entries(BASES).map(([k, b]) => `<label class="opt"><input type="radio" name="base" value="${k}" ${settings.base === k ? 'checked' : ''}><span>${b.name}<small>${b.desc}</small></span></label>`).join('')}
    <label class="opt"><input type="checkbox" id="trailChk" ${settings.trails ? 'checked' : ''}><span>등산로 표시<small>표지가 있는 등산 코스를 색 선으로 겹쳐 보여 줍니다</small></span></label>
    <p class="note">지형도는 17단계까지 상세하게 나오고, 그보다 확대하면 같은 지도를 늘려 보여 줍니다.</p>`, sh => {
    sh.querySelectorAll('input[name=base]').forEach(r => r.onchange = () => { setBase(r.value); });
    sh.querySelector('#trailChk').onchange = e => setTrails(e.target.checked);
  });
};

/* ================= 시작 ================= */
if (rec) {
  if (!Array.isArray(rec.pts)) rec.pts = [];
  recRebuild();
  startWatch();
  if (rec.state === 'run') { keepAwake(true); toast('진행 중이던 산행 기록을 이어갑니다', 3000); }
}
renderRecUI();
updateSun();
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: 'geolocation' }).then(s => {
    if (s.state === 'granted') { if (!view0) follow = true; startWatch(); }
    else if (!view0) toast('오른쪽 아래 ◎ 버튼을 눌러 내 위치를 켜세요', 4000);
  }).catch(() => {});
} else if (!view0) toast('오른쪽 아래 ◎ 버튼을 눌러 내 위치를 켜세요', 4000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
